<!-- الحاوية الخلفية (Backdrop) في وضع الموبايل فقط عند فتح الـ Drawer -->
@if (isMobile() && isOpen()) {
  <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
}

<aside
  class="sidebar"
  dir="rtl"
  [class.sidebar-open]="isOpen() || !isMobile()"
  [class.sidebar-mini]="isMiniMode()"
>
  <nav class="sidebar-nav" id="sidebar">
    @for (section of sections; track section.title) {
      <div class="nav-section">
        <h6 class="nav-section-title">{{ section.title }}</h6>
        <ul class="nav-menu">
          @for (item of section.items; track item.path) {
            <li class="nav-item">
              <a
                [routerLink]="item.path"
                class="nav-link"
                routerLinkActive="nav-active"
                [routerLinkActiveOptions]="{ exact: false }"
                [title]="item.label"
                (click)="onLinkClicked()"
              >
                <div class="icon-text">
                  <i [class]="isActive(item.path) ? item.iconActive : item.iconInactive"></i>
                  <span class="nav-label">{{ item.label }}</span>
                </div>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</aside>
